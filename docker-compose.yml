version: '3.8'

services:
  # FastAPI Application Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee_api_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/employeedb
      - STORAGE_MODE=s3
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=mock_access_key
      - AWS_SECRET_ACCESS_KEY=mock_secret_key
      - S3_BUCKET_NAME=employee-photos-bucket
      - S3_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/employee-photo-tasks
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: always

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee_api_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  # PostgreSQL Relational Database Service
  db:
    image: postgres:16-alpine
    container_name: employee_api_db
    environment:
      - POSTGRES_DB=employeedb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employeedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack AWS Emulation Service (S3 & SQS)
  localstack:
    image: localstack/localstack:latest
    container_name: employee_api_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"

volumes:
  postgres_data:
